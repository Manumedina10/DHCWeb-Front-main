name: Deploy a DonWeb

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar codigo
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Instalar dependencias
      run: npm install

    - name: Compilar proyecto Angular
      run: npx ng build --configuration production

    - name: Instalar sshpass
      run: sudo apt-get update && sudo apt-get install -y sshpass

    - name: Subir archivos a DonWeb por SSH / rsync
      run: |
        sshpass -p "${{ secrets.SSH_PASSWORD }}" rsync -avz -e "ssh -p 5038 -o StrictHostKeyChecking=no" dist/dhcweb-front/browser/ root@179.43.112.37:/var/www/html/dhcanalytics/
